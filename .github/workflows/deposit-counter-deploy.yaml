name: Deposit Counter Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - "frontend/deposit-counter/**"
      - "firebase.json"
      - ".firebaserc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deposit-counter-deploy.yaml"

jobs:
  build-and-deploy-deposit-counter:
    name: Build and Deploy Deposit Counter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Deploy Deposit Counter
        run: pnpm deploy:deposit-counter
