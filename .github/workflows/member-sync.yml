name: Member Sync

on:
  # schedule:
  #   # Daily at 1 AM UTC (6 PM EST, 3 PM PST)
  #   - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      sync_type:
        description: "Sync type: all or only-modified"
        required: false
        type: choice
        options:
          - only-modified
          - all
        default: "only-modified"
jobs:
  sync-members:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTION_CACHE_PATH: ${{ github.workspace }}/member-data-cache
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup cache directory
        run: |
          mkdir -p ${{ env.GITHUB_ACTION_CACHE_PATH }}

      - name: Cache member data
        uses: actions/cache@v4
        with:
          path: ${{ env.GITHUB_ACTION_CACHE_PATH }}
          key: member-data-${{ hashFiles('backend/pushpay-sync/src/services/giving-sync.ts') }}-${{ github.run_attempt }}
          restore-keys: |
            member-data-${{ hashFiles('backend/pushpay-sync/src/services/giving-sync.ts') }}-
            member-data-

      - name: Setup Google Cloud credentials
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Inject .env file
        run: |
          cd backend/pushpay-sync
          printf "%s" "${{ secrets.PUSHPAY_SYNC_ENV_FILE }}" > .env

      - name: Run member sync
        env:
          SYNC_TYPE: ${{ inputs.sync_type }}
        run: |
          pnpm pushpay-sync:members

      - name: Upload cache artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-data-cache
          path: ${{ env.GITHUB_ACTION_CACHE_PATH }}
          retention-days: 7
